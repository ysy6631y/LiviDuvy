name: Publish LiviDuvy WebGL

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing LiviDuvy-WebGL.zip
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Download the verified Unity build
        env:
          GH_TOKEN: ${{ github.token }}
          WEBGL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lividuvy-release"
          gh release download "$WEBGL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern LiviDuvy-WebGL.zip --dir "$RUNNER_TEMP/lividuvy-release"
          python3 -m zipfile -e "$RUNNER_TEMP/lividuvy-release/LiviDuvy-WebGL.zip" _site
          python3 tools/verify_site.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
